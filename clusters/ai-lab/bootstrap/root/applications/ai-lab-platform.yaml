apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-lab-platform
  namespace: argocd
  labels:
    homelab.io/cluster: ai-lab
    homelab.io/layer: platform
    homelab.io/scope: cluster-shared
spec:
  project: default
  source:
    repoURL: https://github.com/bhenriq-souza/homelab-gitops.git
    targetRevision: main
    path: clusters/ai-lab/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-shared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
