apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-lab-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    homelab.io/cluster: ai-lab
    homelab.io/layer: platform
    homelab.io/scope: cluster-shared
    homelab.io/component: secrets
spec:
  project: default
  source:
    repoURL: https://github.com/bhenriq-souza/homelab-gitops.git
    targetRevision: main
    path: clusters/ai-lab/platform/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
