apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factory
  namespace: argocd
  labels:
    homelab.io/environment: factory
    homelab.io/scope: environment
spec:
  project: default
  source:
    repoURL: https://github.com/bhenriq-souza/homelab-gitops.git
    targetRevision: main
    path: clusters/homelab/workloads/factory
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
