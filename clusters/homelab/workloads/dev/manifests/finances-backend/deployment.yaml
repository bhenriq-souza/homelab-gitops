apiVersion: apps/v1
kind: Deployment
metadata:
  name: finances-backend
  namespace: dev-apps
  labels:
    app.kubernetes.io/name: finances-backend
    app.kubernetes.io/part-of: workloads-dev
    homelab.io/environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finances-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finances-backend
        homelab.io/environment: dev
        # Exigida pela NetworkPolicy do PostgreSQL para liberar a porta 5432.
        # Já declarada aqui para que a conexão ao banco (FCB-006) não esbarre nela.
        homelab.io/database-access: postgresql
    spec:
      imagePullSecrets:
        - name: ar-image-pull-secret
      containers:
        - name: finances-backend
          # O pipeline reescreve esta linha com a tag do commit; manter o formato.
          image: us-central1-docker.pkg.dev/homelab-492918/homelab-apps/finances-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: APPLICATION_NAME
              value: finances-control-backend
            - name: APPLICATION_VERSION
              value: "0.0.0"
            - name: ENV
              value: dev
            - name: SERVER_PORT
              value: "3000"
            - name: LOG_LEVEL
              value: info
          # /health é liveness puro: não toca em dependência externa, então uma
          # indisponibilidade do banco não faz o kubelet reiniciar o pod.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
