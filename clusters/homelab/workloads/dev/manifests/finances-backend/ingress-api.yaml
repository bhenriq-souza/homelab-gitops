apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finances-backend-api
  namespace: dev-apps
  labels:
    app.kubernetes.io/name: finances-backend
    homelab.io/environment: dev
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: dev-apps-finances-backend-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: finances.dev.homelab.local
      http:
        paths:
          # A raiz do host é do finances-frontend; aqui só /api, com o stripPrefix.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: finances-backend
                port:
                  number: 80
    # Host alternativo, temporário, para celular e tablet sem DNS de homelab.local:
    # o nip.io resolve pelo DNS público para o IP do Traefik (spike T-0006-01 do frontend).
    # O nome sem o .dev é do prd, que é o que o responsável usa no dia a dia.
    - host: finances.dev.192.168.15.97.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: finances-backend
                port:
                  number: 80
