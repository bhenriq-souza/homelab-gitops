apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finances-backend-api
  namespace: dev-apps
  labels:
    app.kubernetes.io/name: finances-backend
    homelab.io/environment: dev
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: dev-apps-finances-backend-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: finances.dev.homelab.local
      http:
        paths:
          # O ingress finances-backend (path /) continua até o frontend ocupar a raiz.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: finances-backend
                port:
                  number: 80
