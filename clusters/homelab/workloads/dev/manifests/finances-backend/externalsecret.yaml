apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finances-backend-database
  namespace: dev-apps
  labels:
    app.kubernetes.io/name: finances-backend
    homelab.io/environment: dev
    homelab.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-dev
  target:
    name: finances-backend-database
    creationPolicy: Owner
  data:
    # URL completa, com o role dedicado da aplicação. A senha vive só aqui e no
    # Secret Manager — nunca no manifesto, nunca no repositório da aplicação.
    - secretKey: DATABASE_URL
      remoteRef:
        key: homelab-dev-finances-database-url
