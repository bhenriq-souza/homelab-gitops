apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finances-backend-secrets
  namespace: dev-apps
  labels:
    app.kubernetes.io/name: finances-backend
    homelab.io/environment: dev
    homelab.io/component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-dev
  target:
    name: finances-backend-secrets
    creationPolicy: Owner
  data:
    # URL completa, com o role dedicado da aplicação. A senha vive só aqui e no
    # Secret Manager — nunca no manifesto, nunca no repositório da aplicação.
    - secretKey: DATABASE_URL
      remoteRef:
        key: homelab-dev-finances-database-url
    # Credencial do firebase-admin: o backend a usa para verificar o ID token de
    # cada requisição (ADR-0006). JSON em uma linha.
    - secretKey: FIREBASE_SERVICE_ACCOUNT
      remoteRef:
        key: homelab-dev-finances-firebase-service-account
    # Email promovido a ADMIN no primeiro acesso. Só promove, nunca rebaixa.
    - secretKey: IDENTITY_BOOTSTRAP_ADMIN_EMAIL
      remoteRef:
        key: homelab-dev-finances-bootstrap-admin-email
