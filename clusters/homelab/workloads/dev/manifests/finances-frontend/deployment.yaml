apiVersion: apps/v1
kind: Deployment
metadata:
  name: finances-frontend
  namespace: dev-apps
  labels:
    app.kubernetes.io/name: finances-frontend
    app.kubernetes.io/part-of: workloads-dev
    homelab.io/environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finances-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finances-frontend
        homelab.io/environment: dev
      annotations:
        # sha256 (16 primeiros) do config.js do ConfigMap: mudar o config muda esta
        # anotação e reinicia o pod, porque o subPath não recarrega sozinho.
        homelab.io/config-hash: "7111ffe675b12cb1"
    spec:
      imagePullSecrets:
        - name: ar-image-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: finances-frontend
          # O pipeline reescreve esta linha com a tag do commit; manter o formato.
          image: us-central1-docker.pkg.dev/homelab-492918/homelab-apps/finances-frontend:sha-7a258df
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # config.js de runtime (spec 0007): um arquivo só, por subPath.
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            # pid e temporários do nginx unprivileged, com o rootfs só de leitura.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-config
          configMap:
            name: finances-frontend-config
        - name: tmp
          emptyDir: {}
