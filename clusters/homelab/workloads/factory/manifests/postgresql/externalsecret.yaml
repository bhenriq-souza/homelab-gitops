apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-auth
  namespace: factory
  labels:
    app.kubernetes.io/name: postgresql
    homelab.io/environment: factory
    homelab.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-factory
  target:
    name: postgresql-auth
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      type: Opaque
      data:
        POSTGRES_DB: factory
        POSTGRES_USER: factory
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: factory-postgres-password
