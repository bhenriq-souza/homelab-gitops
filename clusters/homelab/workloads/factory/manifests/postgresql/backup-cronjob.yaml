apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-backup
  namespace: factory
  labels:
    app.kubernetes.io/name: postgresql-backup
    homelab.io/environment: factory
    homelab.io/component: database
spec:
  # 06:30 UTC = 03:30 em Brasília
  schedule: "30 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgresql-backup
            homelab.io/database-access: postgresql
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: pgvector/pgvector:pg16
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -eu
                  out="/backups/factory-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump -h postgresql.factory.svc.cluster.local -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$out.tmp"
                  mv "$out.tmp" "$out"
                  find /backups -name 'factory-*.dump' -mtime +7 -delete
                  ls -lh /backups
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-auth
                      key: POSTGRES_PASSWORD
              envFrom:
                - secretRef:
                    name: postgresql-auth
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgresql-backups
