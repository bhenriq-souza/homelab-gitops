apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-backups
  namespace: factory
  labels:
    app.kubernetes.io/name: postgresql-backup
    homelab.io/environment: factory
    homelab.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
