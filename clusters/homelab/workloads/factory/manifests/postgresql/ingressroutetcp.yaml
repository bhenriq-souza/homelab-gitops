apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: postgresql
  namespace: factory
  labels:
    app.kubernetes.io/name: postgresql
    homelab.io/environment: factory
    homelab.io/component: database
spec:
  entryPoints:
    - factorypg
  routes:
    - match: HostSNI(`*`)
      services:
        - name: postgresql
          port: 5432
