apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: factory
  labels:
    app.kubernetes.io/name: postgresql
    homelab.io/environment: factory
    homelab.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
