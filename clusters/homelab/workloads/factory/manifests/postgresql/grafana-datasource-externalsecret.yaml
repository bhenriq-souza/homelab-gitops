# Datasource "FT Coders Postgres" do Grafana (login grafana_reader, só leitura). O Secret nasce aqui, no namespace
# factory, porque o ClusterSecretStore gcp-sm-factory só atende esse namespace (conditions.namespaces). O sidecar
# de datasources do Grafana lê Secrets com grafana_datasource=1 dos namespaces observability e factory (ver
# observability-kube-prometheus-stack.yaml) e a senha nunca fica no repositório.
# O login e o segredo são criados à mão: README do factory, seção "Grafana".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-datasource-ft-coders-pg
  namespace: factory
  labels:
    app.kubernetes.io/name: postgresql
    homelab.io/environment: factory
    homelab.io/component: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-factory
  target:
    name: grafana-datasource-ft-coders-pg
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          grafana_datasource: "1"
      data:
        ft-coders-pg.yaml: |
          apiVersion: 1
          datasources:
            - name: FT Coders Postgres
              uid: ft-coders-pg
              type: grafana-postgresql-datasource
              access: proxy
              url: postgresql.factory.svc.cluster.local:5432
              user: grafana_reader
              isDefault: false
              editable: false
              jsonData:
                database: factory
                sslmode: disable
                postgresVersion: 1600
                maxOpenConns: 5
                maxIdleConns: 2
              secureJsonData:
                password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: factory-grafana-reader-password
