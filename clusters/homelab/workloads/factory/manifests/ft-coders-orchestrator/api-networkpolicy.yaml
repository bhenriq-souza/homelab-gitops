# API de leitura (spec 0024 do ft-coders). Entrada: só o Traefik. Saída: DNS, o Postgres do namespace e o
# Loki em observability. Sem internet: a API não precisa sair do cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ft-coders-api
  namespace: factory
  labels:
    app.kubernetes.io/name: ft-coders-api
    homelab.io/environment: factory
    homelab.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ft-coders-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
              app.kubernetes.io/component: single-binary
      ports:
        - protocol: TCP
          port: 3100
