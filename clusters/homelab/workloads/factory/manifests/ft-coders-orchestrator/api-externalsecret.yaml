# Senha do login ft_coders_api (só leitura). O segredo e o login são criados à mão, pelo runbook do
# ft-coders ("API de leitura"); a senha nunca passa pelo git nem pelo terminal.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ft-coders-api-db
  namespace: factory
  labels:
    app.kubernetes.io/name: ft-coders-api
    homelab.io/environment: factory
    homelab.io/component: api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-factory
  target:
    name: ft-coders-api-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: factory-api-db-password
