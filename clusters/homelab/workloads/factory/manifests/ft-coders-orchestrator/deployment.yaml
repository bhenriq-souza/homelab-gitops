# Orquestrador da FT Coders (spec 0022 do ft-coders): polling do Azure Boards, escrita no tracker e push
# dos bundles. Uma réplica só, com Recreate: nunca dois pods ao mesmo tempo, e o advisory lock
# `orchestrator:singleton` segura um orquestrador manual que rode ao lado. O runner fica na ai-lab (D8).
# go-live em 08/11/2026 (spec 0022): uma réplica; parar = replicas: 0 ou pausar o tenant (runbook do ft-coders).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ft-coders-orchestrator
  namespace: factory
  labels:
    app.kubernetes.io/name: ft-coders-orchestrator
    app.kubernetes.io/part-of: ft-coders
    homelab.io/environment: factory
    homelab.io/component: orchestrator
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ft-coders-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ft-coders-orchestrator
        app.kubernetes.io/part-of: ft-coders
        # o Alloy do cluster vira `app` e `process` em labels do Loki (spec 0022)
        app: ft-coders
        homelab.io/process: orchestrator
        # liberado pela NetworkPolicy do Postgres do namespace
        homelab.io/database-access: postgresql
    spec:
      imagePullSecrets:
        - name: ar-image-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # a migração roda aqui, serializada pelo advisory lock `migrations`; o runner nunca migra
      initContainers:
        - name: migrate
          # O pipeline reescreve as linhas `image:` com a tag do commit; manter o formato.
          image: us-central1-docker.pkg.dev/homelab-492918/homelab-apps/ft-coders-orchestrator:sha-ddfc8c5
          args: ["db", "migrate"]
          env:
            - name: FACTORY_DATABASE_URL
              value: postgresql://factory@postgresql.factory.svc:5432/factory
            # a senha vai pelo PGPASSWORD (libpq): o DSN fica sem segredo e sem escape de URL
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-auth
                  key: POSTGRES_PASSWORD
            - name: FACTORY_SECRET_BACKEND
              value: gcp
            - name: FACTORY_GCP_PROJECT
              value: homelab-492918
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/gcp/key.json
            - name: FACTORY_LOG_JSON
              value: "true"
          volumeMounts:
            - name: work
              mountPath: /var/lib/ft-coders
            - name: tmp
              mountPath: /tmp
            - name: gcp-key
              mountPath: /var/run/secrets/gcp
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: orchestrator
          image: us-central1-docker.pkg.dev/homelab-492918/homelab-apps/ft-coders-orchestrator:sha-ddfc8c5
          args: ["orchestrator"]
          env:
            - name: FACTORY_DATABASE_URL
              value: postgresql://factory@postgresql.factory.svc:5432/factory
            # a senha vai pelo PGPASSWORD (libpq): o DSN fica sem segredo e sem escape de URL
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-auth
                  key: POSTGRES_PASSWORD
            - name: FACTORY_SECRET_BACKEND
              value: gcp
            - name: FACTORY_GCP_PROJECT
              value: homelab-492918
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/gcp/key.json
            - name: FACTORY_LOG_JSON
              value: "true"
          volumeMounts:
            - name: work
              mountPath: /var/lib/ft-coders
            - name: tmp
              mountPath: /tmp
            - name: gcp-key
              mountPath: /var/run/secrets/gcp
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # heartbeat gravado a cada ciclo e durante o standby; 15 min sem ele = processo travado
          livenessProbe:
            exec:
              command: ["/app/.venv/bin/factory", "health", "--max-age", "900"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 2
      # SIGTERM: o ciclo em andamento termina (escritas idempotentes); folga para o push em curso
      terminationGracePeriodSeconds: 330
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: gcp-key
          secret:
            secretName: ft-coders-orchestrator-gcp
            defaultMode: 0400
---
# API de leitura da FT Coders (spec 0024 do ft-coders): só lê o Postgres (login ft_coders_api, role
# ft_coders_read) e o Loki. Fica neste arquivo de propósito: o pipeline reescreve as linhas `image:` só aqui,
# e a API sobe sempre na mesma versão do orquestrador (o mesmo schema). Sem autenticação até a tarefa 3.5:
# acesso só pelo Ingress interno e a NetworkPolicy aceita entrada só do Traefik (INV-0024-10).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ft-coders-api
  namespace: factory
  labels:
    app.kubernetes.io/name: ft-coders-api
    app.kubernetes.io/part-of: ft-coders
    homelab.io/environment: factory
    homelab.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ft-coders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ft-coders-api
        app.kubernetes.io/part-of: ft-coders
        # o Alloy do cluster vira `app` e `process` em labels do Loki
        app: ft-coders
        homelab.io/process: api
        # liberado pela NetworkPolicy do Postgres do namespace
        homelab.io/database-access: postgresql
    spec:
      imagePullSecrets:
        - name: ar-image-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # O pipeline reescreve as linhas `image:` com a tag do commit; manter o formato.
          image: us-central1-docker.pkg.dev/homelab-492918/homelab-apps/ft-coders-orchestrator:sha-ddfc8c5
          args: ["api"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FACTORY_DATABASE_URL
              value: postgresql://ft_coders_api@postgresql.factory.svc:5432/factory
            # a senha vai pelo PGPASSWORD (libpq), como no orquestrador
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ft-coders-api-db
                  key: password
            - name: FACTORY_LOKI_URL
              value: http://loki.observability.svc:3100
            - name: FACTORY_API_HOST
              value: 0.0.0.0
            - name: FACTORY_API_PORT
              value: "8000"
            - name: FACTORY_LOG_JSON
              value: "true"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          # pronto = Postgres respondendo (/api/v1/health); vivo = o processo aceita conexão. Separados para
          # uma queda do Postgres tirar a API do Service sem reiniciá-la em laço.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
      # os streams SSE são cortados no SIGTERM; o EventSource reconecta com Last-Event-ID
      terminationGracePeriodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
