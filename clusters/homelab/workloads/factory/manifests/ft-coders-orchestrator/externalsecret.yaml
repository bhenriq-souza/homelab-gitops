# Chave da SA ft-coders-orchestrator (homelab-infra, ft-coders.tf): lê só os segredos do orquestrador no
# Secret Manager, sob demanda (secret_backend=gcp). Trocar o PAT no SM não exige redeploy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ft-coders-orchestrator-gcp
  namespace: factory
  labels:
    app.kubernetes.io/name: ft-coders-orchestrator
    homelab.io/environment: factory
    homelab.io/component: orchestrator
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-factory
  target:
    name: ft-coders-orchestrator-gcp
    creationPolicy: Owner
  data:
    - secretKey: key.json
      remoteRef:
        key: factory-orchestrator-sa-key
