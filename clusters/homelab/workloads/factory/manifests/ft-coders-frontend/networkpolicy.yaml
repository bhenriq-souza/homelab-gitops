# UI estática (spec 0007 do ft-coders-frontend). Entrada: só o Traefik, na 8080. Saída: só DNS; o
# navegador fala com a API pelo Ingress, nunca este pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ft-coders-frontend
  namespace: factory
  labels:
    app.kubernetes.io/name: ft-coders-frontend
    homelab.io/environment: factory
    homelab.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ft-coders-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
