apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-auth
  namespace: prd-apps
  labels:
    app.kubernetes.io/name: postgresql
    homelab.io/environment: prd
    homelab.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-prd
  target:
    name: postgresql-auth
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      type: Opaque
      # Só o superusuário vive aqui. Cada aplicação ganha database e role próprios
      # pelo scripts/provision-app-database.sh (NAMESPACE=prd-apps ADMIN_USER=postgres
      # ADMIN_DB=postgres), como em dev.
      data:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: homelab-prd-postgres-password
