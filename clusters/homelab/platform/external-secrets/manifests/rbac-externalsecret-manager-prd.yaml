apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: externalsecret-manager
  namespace: prd-apps
  labels:
    homelab.io/environment: prd
    homelab.io/component: secrets
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: externalsecret-manager-argocd
  namespace: prd-apps
  labels:
    homelab.io/environment: prd
    homelab.io/component: secrets
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: externalsecret-manager
