apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-sm-factory
  labels:
    homelab.io/environment: factory
    homelab.io/component: secrets
spec:
  conditions:
    - namespaces:
        - factory
  provider:
    gcpsm:
      projectID: homelab-492918
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: eso-gcp-sa-key-prd
            namespace: external-secrets
            key: service-account.json
