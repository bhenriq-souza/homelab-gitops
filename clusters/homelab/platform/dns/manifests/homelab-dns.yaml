# DNS autoritativo da zona homelab.local para a LAN.
# Responde *.homelab.local -> IP do Traefik (192.168.15.97), entao todo Ingress
# novo resolve sem cadastro. Qualquer outra zona recebe REFUSED: nao e resolver
# recursivo. Os clientes encaminham so homelab.local para ca (NRPT no Windows).
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-dns
  namespace: platform-shared
  labels:
    homelab.io/scope: cluster-shared
    homelab.io/component: dns
data:
  Corefile: |
    homelab.local:5353 {
        errors
        health :8080
        ready :8181
        template IN A homelab.local {
            answer "{{ .Name }} 60 IN A 192.168.15.97"
        }
        # AAAA vazio com NOERROR: sem isso o cliente recebe NXDOMAIN e pode desistir do nome.
        template IN AAAA homelab.local {
            rcode NOERROR
        }
        cache 60
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-dns
  namespace: platform-shared
  labels:
    homelab.io/scope: cluster-shared
    homelab.io/component: dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-dns
      annotations:
        # Reinicia o pod quando o Corefile muda (incrementar ao editar o ConfigMap).
        homelab.io/corefile-revision: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coredns
          # Mesma imagem do CoreDNS do k3s, ja presente no no.
          image: rancher/mirrored-coredns-coredns:1.14.1
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: homelab-dns
---
# ServiceLB (klipper) publica a porta 53 no IP do no, como faz com o Traefik.
apiVersion: v1
kind: Service
metadata:
  name: homelab-dns
  namespace: platform-shared
  labels:
    homelab.io/scope: cluster-shared
    homelab.io/component: dns
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 192.168.15.0/24
  selector:
    app.kubernetes.io/name: homelab-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
